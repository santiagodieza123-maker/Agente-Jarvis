[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "websockets>=13", "langgraph>=1.0", "pillow>=10", "mss>=9", "psutil>=5.9"]

[project.optional-dependencies]
windows = ["uiautomation", "comtypes", "keyring"]
mcp = ["mcp>=1.2"]
web = ["playwright>=1.56"]   # luego: playwright install chromium
dev = ["pytest"]

[tool.setuptools]
packages = ["core", "core.llm", "actuators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
